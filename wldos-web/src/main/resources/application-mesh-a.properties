# ============================================================================
# \u5B9E\u4F8B A \u9644\u52A0\u914D\u7F6E\uFF08\u4EC5 dev \u672C\u673A\u53CC\u7AEF\u53E3\u8054\u8C03\uFF0C\u975E\u751F\u4EA7 scale-out \u6A21\u5F0F\uFF09
# \u4E0E application-dev.properties \u53E0\u52A0\u4F7F\u7528\uFF1Aprofile=dev,mesh-a
#   - dev  \u63D0\u4F9B\u57FA\u7840\u73AF\u5883\uFF08\u6570\u636E\u5E93 / app.secret_key / AI\u00B7IoT \u5F00\u5173\u7B49\uFF09
#   - mesh-a \u4EC5\u653E\u201C\u5B9E\u4F8B\u5DEE\u5F02\u9879\u201D\uFF0C\u8986\u76D6/\u8FFD\u52A0\u5728 dev \u4E4B\u4E0A\uFF08\u540E\u52A0\u8F7D\u8005\u8986\u76D6\u540C\u540D\u952E\uFF09
# \u542F\u52A8\u65B9\u5F0F\uFF08\u5FC5\u987B\u7528\u542B\u201C\u52A0\u5BC6 agent\u201D\u7684\u8FD0\u884C\u65B9\u5F0F\uFF0C\u5426\u5219 mesh \u4E0D\u542F\u52A8\uFF09\uFF1A
#   - IDE\uFF1A\u590D\u5236\u542F\u52A8\u914D\u7F6E\uFF0CVM \u53C2\u6570\u52A0 -Dspring.profiles.active=dev,mesh-a\uFF08classpath \u5DF2\u542B\u91CF\u4EA7\u52A0\u5BC6 agent\uFF09
#   - \u4EA7\u7269\uFF1Ajava -Dspring.profiles.active=dev,mesh-a -jar wldos.war
#   \u6CE8\u610F\uFF1A\u666E\u901A `mvn spring-boot:run` \u4E0D\u52A0\u8F7D\u52A0\u5BC6 agent \u2192 IssueAuth \u56DE\u9000\u793E\u533A\u7248 \u2192 mesh/\u767B\u5F55\u4E0D\u6FC0\u6D3B
# \u751F\u4EA7\u540C\u6784\uFF1A\u540C\u4E00 prod/desktop \u53D1\u884C\u5305 + \u5E73\u53F0 wo_options \u96C6\u7FA4\u7B56\u7565 + \u5B9E\u4F8B\u73AF\u5883\u53D8\u91CF\uFF08\u89C1 /platform/mesh/scale-out/hint\uFF09
# \u914D\u5957\uFF1A\u5B9E\u4F8B B \u89C1 application-mesh-b.properties\uFF089999 / dev-instance-b / WORKER\uFF09
# ============================================================================

# \u672C\u5B9E\u4F8B HTTP \u7AEF\u53E3\uFF08b\u8986\u76D6 dev \u9ED8\u8BA4 8088\uFF09\uFF1B\u53CC\u5B9E\u4F8B\u4EE5\u7AEF\u53E3\u533A\u5206\uFF1AA=8088\u3001B=9999
# server.port=8080

# \u542F\u7528\u670D\u52A1\u7F51\u683C\uFF1Bfalse \u5219\u4E0D\u8D77 mesh \u8C03\u5EA6/\u53D1\u73B0/\u5171\u8BC6
wldos.mesh.enabled=true

# \u672C\u8282\u70B9\u552F\u4E00\u6807\u8BC6\uFF08\u96C6\u7FA4\u5185\u4E0D\u53EF\u91CD\u590D\uFF09\uFF1B\u6210\u5458\u8868\u3001\u5206\u5DE5(assignment)\u3001\u5171\u8BC6\u5747\u6309\u6B64 id \u8BC6\u522B
wldos.mesh.node-id=dev-instance-a

# \u672C\u8282\u70B9\u5BF9\u5916\u53EF\u8FBE\u5730\u5740\uFF0C\u4F9B\u5176\u5B83\u8282\u70B9\u56DE\u8FDE/\u8C03\u7528\uFF1B\u5FC5\u987B\u662F peer \u5B9E\u9645\u80FD\u8BBF\u95EE\u5230\u7684\u5730\u5740
wldos.mesh.advertise-url=http://127.0.0.1:${server.port}

# \u542F\u52A8\u65F6\u4E3B\u52A8\u63E1\u624B\u7684\u79CD\u5B50\u8282\u70B9\uFF08\u8FD9\u91CC\u6307\u5411 B\uFF09\uFF1B\u4E4B\u540E\u7ECF gossip \u4F20\u9012\u5F0F\u53D1\u73B0\u5168\u7F51\uFF0C\u6210\u5458\u89C6\u56FE\u6700\u7EC8\u4E00\u81F4
# \u591A\u4E2A\u79CD\u5B50\u7528 bootstrap-peers[1]\u3001bootstrap-peers[2]... \u8FFD\u52A0
wldos.mesh.bootstrap-peers[0]=http://127.0.0.1:9999

# \u5185\u90E8 mesh API\uFF08/internal/mesh/*\uFF09\u7684\u9274\u6743\u4EE4\u724C\uFF1B\u96C6\u7FA4\u6240\u6709\u8282\u70B9\u5FC5\u987B\u76F8\u540C\uFF0C\u5426\u5219\u4E92\u8C03\u88AB\u62D2
wldos.mesh.internal-token=dev-mesh-token

# \u5185\u90E8\u8C03\u7528\u9274\u6743\u6A21\u5F0F\uFF1A
#   loopback_or_token \u2014\u2014 \u672C\u673A\u56DE\u73AF\u6216\u643A\u5E26 token \u5373\u653E\u884C\uFF08dev \u9ED8\u8BA4\uFF09
#   token_required    \u2014\u2014 \u5F3A\u5236\u6821\u9A8C token\uFF08\u9884\u751F\u4EA7/\u8054\u90A6\u573A\u666F\uFF09
wldos.mesh.auth-mode=loopback_or_token

# \u5FC3\u8DF3 / gossip \u5468\u671F\uFF08\u79D2\uFF09\uFF1Bdev \u53CC\u5B9E\u4F8B\u8054\u8C03\u53D6 30 \u964D\u4F4E CPU/\u65E5\u5FD7\u5F00\u9500\uFF0C\u751F\u4EA7\u53EF\u6309\u6536\u655B\u9700\u6C42\u8C03\u5C0F
wldos.mesh.heartbeat-interval-seconds=30

# \u6210\u5458\u5B58\u6D3B TTL\uFF08\u79D2\uFF09\uFF1B\u8D85\u8FC7\u8BE5\u65F6\u957F\u672A\u6536\u5230\u5FC3\u8DF3\u5373\u5224\u5B9A\u4E0B\u7EBF\u5E76 evict\uFF0C\u89E6\u53D1\u5206\u5DE5 reconcile\u3002\u5EFA\u8BAE \u2265 3\u00D7\u5FC3\u8DF3
wldos.mesh.member-ttl-seconds=90

# dev \u53CC\u5B9E\u4F8B\u8054\u8C03\uFF1A\u5173\u95ED web/RestTemplate DEBUG\uFF0C\u907F\u514D\u63E1\u624B/\u5FC3\u8DF3\u5237\u5C4F\u62D6\u57AE IDEA CPU
logging.level.web=info
logging.level.org.springframework.web.client.RestTemplate=warn

# \u8282\u70B9\u89D2\u8272\uFF1ACOORDINATOR\uFF08\u534F\u8C03\u8005\uFF0C\u53C2\u4E0E\u5206\u5DE5/\u8054\u90A6\u534F\u8C03\uFF09| WORKER\uFF08\u5DE5\u4F5C\u8282\u70B9\uFF09
wldos.mesh.node-role=COORDINATOR

# compute ai-inference\uFF1A\u540C JVM \u4F18\u5148\u8FDB\u7A0B\u5185\u5951\u7EA6\uFF1BHTTP delegate \u4E3A fallback
wldos.mesh.compute-prefer-in-process=true

wldos.iot.embedded-broker.port=1883

# dev 双实例默认 HTTP 联调，不在此 profile 开启 mTLS（wldos.mesh.tls-enabled 默认 false）。
# \u82E5\u5728\u7BA1\u7406\u7AEF\u300C\u8282\u70B9\u4E92\u4FE1\u300D\u5F00\u542F TLS \u5E76\u5199\u5165 wo_options\uFF0C\u4F1A\u8986\u76D6\u672C profile\uFF08PropertiesDynImpl addFirst\uFF09\u3002
# \u4EC5\u586B tls-enabled=true \u672A\u914D trust/key store \u4F1A\u5BFC\u81F4\u542F\u52A8\u5931\u8D25\uFF1B\u53EF\u6267\u884C openapi/recover-mesh-tls-wo_options.sql \u56DE\u6EDA\uFF0C
# \u6216\u5728\u8282\u70B9\u4E92\u4FE1\u9875\u4F7F\u7528\u300C\u751F\u6210/\u8F6E\u6362\u672C\u8282\u70B9\u8BC1\u4E66\u300D\u540E\u4FDD\u5B58\u5B8C\u6574\u8DEF\u5F84\u3002
