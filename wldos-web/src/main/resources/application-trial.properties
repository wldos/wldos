# \u914D\u7F6E\u9879\uFF1Awldos_plugin_dir\uFF08\u7559\u7A7A\u5219\u4F7F\u7528\u7EA6\u5B9A\u8DEF\u5F84\uFF1AROOT\u7684\u7236\u76EE\u5F55/plugins\uFF09
# \u652F\u6301\u7EDD\u5BF9\u8DEF\u5F84\uFF1A/opt/wldos/plugins
# wldos_plugin_dir=${wldos_deploy_root}/plugins
# \u8BF4\u660E\uFF1A\u63D2\u4EF6\u5B89\u88C5\u76EE\u5F55\uFF0C\u907F\u514DWAR\u5305\u89E3\u538B\u65F6\u8986\u76D6\u5DF2\u5B89\u88C5\u7684\u63D2\u4EF6
#       \u5F00\u53D1\u65F6\uFF1Awldos-web/plugins\uFF08\u6301\u4E45\u5316\uFF0C\u4E0D\u4F1A\u88AB\u6784\u5EFA\u8986\u76D6\uFF09
#       \u751F\u4EA7\u65F6\uFF1A\u5EFA\u8BAE\u914D\u7F6E\u5230\u72EC\u7ACB\u7684\u5B58\u50A8\u76EE\u5F55\uFF0C\u4FBF\u4E8E\u63D2\u4EF6\u7BA1\u7406\u548C\u5907\u4EFD
#
# 2.1 \u81EA\u7701\u6570\u636E\u6839\uFF08introspection\uFF09
# \u914D\u7F6E\u9879\uFF1Awldos_introspection_data_root\uFF08Spring\uFF1Awldos.introspection.data-root\uFF09
# \u7559\u7A7A\u5219\u7EA6\u5B9A\uFF1AROOT\u7684\u7236\u76EE\u5F55/introspection
# wldos_introspection_data_root=@/shared/introspection
# wldos.introspection.data-root=/opt/wldos/introspection
# 
# 3. \u524D\u7AEFUI\u76EE\u5F55\uFF08ui\uFF09
# \u914D\u7F6E\u9879\uFF1Awldos_frontend_ui_dir\uFF08\u7559\u7A7A\u5219\u4F7F\u7528\u7EA6\u5B9A\u8DEF\u5F84\uFF1AROOT\u7684\u7236\u76EE\u5F55/ui\uFF09
# \u652F\u6301\u7EDD\u5BF9\u8DEF\u5F84\uFF1A/opt/wldos/ui
wldos_frontend_ui_dir=@/wldos-ui/public
# \u63D2\u4EF6 UI\uFF1A\u540C\u90E8\u7F72\u524D\u7AEF\u76EE\u5F55(true)\u6216\u5F15\u64CE\u6258\u7BA1(false)\u3002\u672A\u914D engine-store-dir \u65F6\u9ED8\u8BA4\u4E0E wldos_plugin_dir \u540C\u7EA7\u7684 plugin-ui-store\uFF08\u4E0E plugins \u5E76\u5217\uFF09
# wldos.plugins.ui.co-locate-frontend=true
# wldos.plugins.ui.engine-store-dir=
# \u8BF4\u660E\uFF1A\u524D\u7AEFUI\u6784\u5EFA\u7269\u76EE\u5F55\uFF0C\u5305\u542B\u4E3B\u5E94\u7528\u548C\u63D2\u4EF6UI
#       \u63D2\u4EF6UI\u6784\u5EFA\u7269\u76EE\u5F55\uFF1A\u7EA6\u5B9A\u4E3A \u524D\u7AEFUI\u76EE\u5F55/plugins/{code}/{version}/
#       \u63D2\u4EF6manifest\u6587\u4EF6\u8DEF\u5F84\uFF1A\u7EA6\u5B9A\u4E3A \u524D\u7AEFUI\u76EE\u5F55/plugins/manifest.json
#       \u5F00\u53D1\u73AF\u5883\uFF1A\u4F7F\u7528 public \u76EE\u5F55\uFF0CUmi \u4F1A\u81EA\u52A8\u5C06\u5176\u4F5C\u4E3A\u9759\u6001\u8D44\u6E90\u6839\u76EE\u5F55
#       \u751F\u4EA7\u73AF\u5883\uFF1A\u5EFA\u8BAE\u914D\u7F6E\u5230\u72EC\u7ACB\u7684\u9759\u6001\u8D44\u6E90\u76EE\u5F55\uFF0C\u4FBF\u4E8Enginx\u7B49Web\u670D\u52A1\u5668\u76F4\u63A5\u8BBF\u95EE
# 
# \u4E09\u3001\u90E8\u7F72\u5EFA\u8BAE
# 1. \u751F\u4EA7\u73AF\u5883\u5EFA\u8BAE\u5C06 store\u3001plugins\u3001ui \u914D\u7F6E\u5230\u72EC\u7ACB\u7684\u5B58\u50A8\u76EE\u5F55\u6216\u6302\u8F7D\u7684\u5B58\u50A8\u5377
# 2. \u786E\u4FDD\u8FD9\u4E9B\u76EE\u5F55\u6709\u8DB3\u591F\u7684\u78C1\u76D8\u7A7A\u95F4\u548C\u9002\u5F53\u7684\u6743\u9650
# 3. \u5EFA\u8BAE\u5B9A\u671F\u5907\u4EFD store \u548C plugins \u76EE\u5F55
# 4. nginx \u914D\u7F6E\u793A\u4F8B\uFF1A
