# 1.\u7F51\u5173\u951A\u5B9A\u7684API\u7EDF\u4E00\u524D\u7F00(\u4EC5\u7528\u4E8E\u66B4\u9732API\u7ED9\u524D\u7AEF\u951A\u5B9A)\u3002\u4E0D\u5E26\u7EDF\u4E00\u524D\u7F00\uFF0C\u5E76\u4E14\u4E0D\u662F\u514D\u7B7E\u8DEF\u7531\u548C\u767B\u9646\u9A8C\u8BC1\u8DEF\u7531\u7684\uFF0C\u4E00\u5F8B\u89C6\u4E3A\u975E\u6CD5\u8BF7\u6C42\uFF0C\u9759\u6001\u8D44\u6E90\u4EE5images\u4E3A\u524D\u7F00\uFF0C\u9700\u8981\u6570\u636E\u6743\u9650\u7684\u7531\u4E1A\u52A1\u6A21\u5757\u8BBE\u5B9A
gateway.proxy.prefix=/api
# 2.\u514D\u7B7E\u8BF7\u6C42\u8DEF\u5F84\u524D\u7F00\uFF08\u4E0D\u542B1\uFF09\uFF0C\u7528\u6765\u58F0\u660E\u4E0D\u9700\u8981\u767B\u5F55\u7684\u5F00\u653E\u8D44\u6E90
# 3.0 dev\uFF1A\u7981\u6B62\u6574\u6BB5 /api \u514D JWT\uFF08Mesh \u8D70 /internal/mesh + internal-token\uFF1B\u4E1A\u52A1 API \u987B\u767B\u5F55 JWT\uFF09
gateway.ignore.path=/login,/authcode,/archives,/product,/products,/doc,/license,/favicon.ico,/page,/user/active,/user/searchHints,/ui/plugins,/wechat/mp,/swagger-ui,/swagger-ui.html,/swagger-resources,/v2/api-docs,/webjars,/doc.html,/plugin-assets,/platform/mesh,/trial/send-email-code,/trial/check-email-code,/trial/apply,/trial/entry-context,/,/content,/info,/search,/portal,/robots.txt,/sitemap.xml
wldos.trial.enabled=true
wldos.trial.admin.enabled=true
wldos.trial.fixed-portal-entry=true
wldos.trial.sandbox-domain-suffix=sandbox.local
# \u4F53\u9A8C\u95E8\u6237\u72EC\u7ACB\u79DF\u6237\u4E0B trial.example.com \u7684 wo_domain.id\uFF08\u52FF\u7528\u8FD0\u8425\u4E3B\u7AD9 www \u7684 id\uFF09
# \u4F53\u9A8C\u95E8\u6237 handoff\uFF08\u975E\u5FC5\u987B\u5199 properties\uFF09\uFF1A\u4F18\u5148\u5728\u7BA1\u7406\u7AEF\u300C\u7CFB\u7EDF\u914D\u7F6E\u300D/ wo_options \u7EF4\u62A4\uFF08\u6539\u5E93\u5373\u751F\u6548\uFF0C\u65E0\u9700\u91CD\u542F\uFF09\uFF1A
#   wldos.trial.handoff_entry_domain_id = \u4F53\u9A8C\u95E8\u6237 wo_domain.id
#   wldos.trial.handoff_base_url = https://trial.example.com\uFF08\u53EF\u7559\u7A7A\uFF0C\u7531\u8BE5\u57DF site_url \u63A8\u5BFC\uFF09
# \u672A\u914D\u4E0A\u8FF0\u9879\u65F6\u53EF\u4F5C\u542F\u52A8\u56DE\u9000\uFF08\u53EF\u9009\uFF09\uFF1A
# wldos.trial.handoff-base-url=https://trial.example.com
# wldos.trial.handoff-entry-domain-id=0
# \u8DE8\u5B9E\u4F8B CRM\uFF08\u4E3B\u7AD9 admin.enabled + \u4F53\u9A8C\u5B9E\u4F8B enabled \u5206\u79BB\u90E8\u7F72\uFF09\u65F6\uFF0C\u4EC5\u5728\u4F53\u9A8C\u5B9E\u4F8B\u914D\u7F6E\u5165\u7AD9\u4EE4\u724C\uFF0C\u4F8B\u5982\uFF1A
# wldos.trial.ops-inbound-token=dev-ops-token-32chars-min-random
# \u4E3B\u7AD9\u540C\u503C\u586B\u5728 /admin/sys/trial\u300COps \u5171\u4EAB\u4EE4\u724C\u300D\uFF1B\u4EE3\u7801\u4EC5\u6821\u9A8C\u975E\u7A7A\u4E0E\u5B8C\u5168\u4E00\u81F4\uFF0C\u5EFA\u8BAE \u226532 \u5B57\u8282\u968F\u673A\u3001\u65E0\u7A7A\u683C\u3002
# 3.\u5FC5\u987B\u767B\u5F55\u9A8C\u8BC1\u8DEF\u5F84\u524D\u7F00\uFF08\u4E0D\u542B1\uFF0C\u4E0D\u80FD\u5728\u89D2\u8272\u6743\u9650\u8BBE\u7F6E\u4ECD\u9700\u9274\u6743\u7684\u52A8\u6001\u53C2\u6570\u8DEF\u7531\uFF0C\u5982\uFF1A/space/book/:bookId\uFF09
gateway.token.path=/space,/admin,/oss,/ticket
# \u64CD\u4F5C\u65E5\u5FD7\u5BA1\u8BA1\u8DEF\u5F84\u524D\u7F00\uFF08\u9700\u8981\u5F3A\u5236\u8BB0\u5F55\u64CD\u4F5C\u65E5\u5FD7\u7684\u8DEF\u7531\uFF1A\u7CFB\u7EDF\u7BA1\u7406\u3001\u4EA4\u6613\uFF09
gateway.log.path=/admin

wldos.gateway.rate-limit.enabled=false
wldos.gateway.audit.access-denied.mode=aggregate
wldos.gateway.probe.enabled=false
wldos.gateway.probe.paths=/.env,/.git,/wp-admin,/wp-login.php,/phpMyAdmin,/phpmyadmin
wldos.gateway.probe.audit-enabled=false
wldos.gateway.ip-deny.response-status=404

# ==================== wldos API \u9274\u6743\uFF08AuthOpenerImpl\uFF09 ====================
# \u8DEF\u5F84\u5339\u914D\u5F15\u64CE\uFF1Aant\uFF08\u63A8\u8350\uFF0CAntPathMatcher\uFF0C\u652F\u6301 {id}/{slug:.+}/** \u7B49 Spring \u98CE\u683C\u5360\u4F4D\u7B26\uFF09 | legacy\uFF08\u65E7 {*} \u66FF\u6362\uFF0C\u5E94\u6025\u56DE\u9000\uFF09
wldos.auth.matcher=ant
# \u4E25\u683C\u6A21\u5F0F\u5F00\u5173\uFF1A\u9ED8\u8BA4 OFF\uFF08\u672A\u5339\u914D\u8D44\u6E90\u4ECD\u7136\u653E\u884C\uFF0C\u4FDD\u7559\u5B58\u91CF\u8BED\u4E49\u3001\u96F6\u8FC1\u79FB\u6210\u672C\uFF09
# \u9700\u8981"\u96F6\u4FE1\u4EFB RBAC"\u7684\u5B9E\u65BD\u65B9\u6539\u4E3A true\uFF0C\u5E76\u6309\u654F\u611F\u5EA6\u914D\u7F6E strict-mode.paths
wldos.auth.strict-mode.enabled=false
# \u4E25\u683C\u6A21\u5F0F\u8986\u76D6\u8DEF\u5F84\uFF08AntPath \u6A21\u677F\uFF0C\u9017\u53F7\u5206\u9694\uFF09\uFF1B\u4EC5\u5728 strict-mode.enabled=true \u65F6\u751F\u6548\uFF1B\u4E3A\u7A7A\u5219\u542F\u7528\u65F6\u5168\u5C40\u4E25\u683C
# \u63A8\u8350\u503C\uFF08\u542F\u7528\u4E25\u683C\u6A21\u5F0F\u65F6\uFF09\uFF1A/admin/**,/space/**,/oss/**,/ticket/**
wldos.auth.strict-mode.paths=/admin/**,/space/**,/oss/**,/ticket/**,/ai/**

# rest\u8BF7\u6C42\u8D85\u65F6\u65F6\u95F4\uFF0C\u5355\u4F4D\u6BEB\u79D2\uFF0C\u6709\u6700\u5C0F\u503C50\u79D2
restemplate.connection.timeout=50000
restemplate.read.timeout=50000

# \u9759\u6001\u8D44\u6E90\u7F13\u5B58\u65F6\u95F4\uFF0C\u5355\u4F4D\u79D2
spring.web.resources.cache.cachecontrol.max-age=1800
# \u5F00\u542Fgzip, brotli\u538B\u7F29
spring.web.resources.chain.compressed=true
# true: \u542F\u7528\u7F13\u5B58
spring.web.resources.chain.cache=true
spring.servlet.multipart.enabled=true
# \u4E0A\u4F20\u6587\u4EF6\u5927\u5C0F
spring.servlet.multipart.max-file-size=50MB

# \u7F29\u7565\u56FE\u8BBE\u7F6E, \u7528\u4E8E\u9002\u914D\u4E0D\u540C\u7EC8\u7AEF\u8282\u7701\u5E26\u5BBD\uFF0C\u8FD8\u6709\u9ED8\u8BA4\u5C3A\u5BF8\u9ED8\u8BA4\u5B58\u50A8
