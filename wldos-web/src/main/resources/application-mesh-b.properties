# \u5B9E\u4F8B B \u9644\u52A0\u914D\u7F6E\uFF08**\u4EC5 dev \u672C\u673A\u53CC\u7AEF\u53E3\u8054\u8C03**\uFF0C\u975E\u751F\u4EA7 scale-out \u6A21\u5F0F\uFF09
# \u542F\u52A8\uFF1Amvn -pl wldos-web spring-boot:run -Dspring-boot.run.profiles=dev,mesh-b

server.port=9999

wldos.mesh.enabled=true
wldos.mesh.node-id=dev-instance-b
wldos.mesh.advertise-url=http://127.0.0.1:${server.port}
wldos.mesh.bootstrap-peers[0]=http://127.0.0.1:8088
wldos.mesh.internal-token=dev-mesh-token
# 内部调用鉴权：loopback_or_token（默认）| token_required（预生产/联邦）
wldos.mesh.auth-mode=loopback_or_token
wldos.mesh.heartbeat-interval-seconds=30
wldos.mesh.member-ttl-seconds=90
wldos.mesh.node-role=WORKER

wldos.mesh.compute-prefer-in-process=true

wldos.iot.embedded-broker.port=1884

logging.level.web=info
logging.level.org.springframework.web.client.RestTemplate=warn

# dev 双实例默认 HTTP；wo_options 集群策略（含 tls-enabled）会覆盖 profile。见 application-mesh-a.properties 末尾 mTLS 说明。
