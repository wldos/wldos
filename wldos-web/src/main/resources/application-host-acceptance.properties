# ============================================================================
# 宿主机功能验收 profile（与 dev,mesh-a|mesh-b|mesh-c 叠加）
# 启用：-Dspring-boot.run.profiles=dev,mesh-a,host-acceptance
# 统一打开 AI + IoT embedded，供 Layer1/Layer2 验收脚本使用
# ============================================================================

wldos.ai.enabled=true
wldos.ai.default-provider=echo
wldos.ai.export-compute-capability=true
wldos.ai.prompt.storage=jdbc
wldos.ai.usage.storage=jdbc

wldos.iot.enabled=true
wldos.iot.storage=jdbc
wldos.iot.connectivity-mode=embedded
wldos.iot.embedded-broker.host=127.0.0.1
wldos.iot.embedded-broker.allow-anonymous=false
