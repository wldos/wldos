# prod + mesh 集群 overlay（profile=prod,mesh-prod）
# 与 application-prod.properties 叠加；每实例 node-id / advertise-url / keystore 不同

wldos.mesh.enabled=true
wldos.mesh.auth-mode=token_or_hmac
wldos.mesh.compute-prefer-in-process=true
wldos.mesh.node-role=WORKER

